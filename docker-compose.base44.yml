# Base44 sandbox dev environment for the Atelier room designer.
#
# The app is a self-contained Python standard-library HTTP server: it serves
# index.html / app.js / styles.css straight from this directory and keeps
# accounts, sessions and saved rooms in atelier.db (SQLite, created on boot).
# There are no pip dependencies and no external services, so this service runs
# the cloned source directly with no build step.
services:
  atelier:
    image: python:3.12-slim
    working_dir: /app
    command: ["sh", "-ec", "exec python3 room-back-endhandler.py"]
    environment:
      - PORT=5173
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5173/', timeout=4).read(1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      base44.project: "Atelier room designer"
      base44.kind: "web"
      base44.port: "3000"
